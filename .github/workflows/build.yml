name: Build Mora Shield APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release signing secrets
        env:
          MORA_KEYSTORE_BASE64: ${{ secrets.MORA_KEYSTORE_BASE64 }}
          MORA_KEYSTORE_PASSWORD: ${{ secrets.MORA_KEYSTORE_PASSWORD }}
          MORA_KEY_ALIAS: ${{ secrets.MORA_KEY_ALIAS }}
          MORA_KEY_PASSWORD: ${{ secrets.MORA_KEY_PASSWORD }}
        run: |
          test -n "$MORA_KEYSTORE_BASE64" || (echo 'Missing MORA_KEYSTORE_BASE64 secret' && exit 1)
          test -n "$MORA_KEYSTORE_PASSWORD" || (echo 'Missing MORA_KEYSTORE_PASSWORD secret' && exit 1)
          test -n "$MORA_KEY_ALIAS" || (echo 'Missing MORA_KEY_ALIAS secret' && exit 1)
          test -n "$MORA_KEY_PASSWORD" || (echo 'Missing MORA_KEY_PASSWORD secret' && exit 1)

      - name: Restore persistent signing keystore
        env:
          MORA_KEYSTORE_BASE64: ${{ secrets.MORA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$MORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mora-release.jks"
          test -s "$RUNNER_TEMP/mora-release.jks"
          chmod 600 "$RUNNER_TEMP/mora-release.jks"

      - name: Run automated link-cleaner tests
        run: bash ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK with persistent signature
        env:
          MORA_KEYSTORE_PATH: ${{ runner.temp }}/mora-release.jks
          MORA_KEYSTORE_PASSWORD: ${{ secrets.MORA_KEYSTORE_PASSWORD }}
          MORA_KEY_ALIAS: ${{ secrets.MORA_KEY_ALIAS }}
          MORA_KEY_PASSWORD: ${{ secrets.MORA_KEY_PASSWORD }}
        run: bash ./gradlew clean assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mora-Shield-release
          path: |
            app/build/outputs/apk/release/*.apk
            location-hook/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
