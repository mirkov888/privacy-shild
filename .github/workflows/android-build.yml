name: Mora Shield Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mora-shield-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Mora Shield
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Checkout pinned Mora Rust Core
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mirkov888/mora-rust-android.git "$RUNNER_TEMP/mora-rust-android"
          git -C "$RUNNER_TEMP/mora-rust-android" checkout --detach 4613c0bdb3b992e05e62b38287101c07ce8ad512

      - name: Validate Mora Rust Core
        working-directory: ${{ runner.temp }}/mora-rust-android
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

      - name: Set up Android NDK for Rust
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true
          local-cache: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Mora Rust native libraries
        working-directory: ${{ runner.temp }}/mora-rust-android
        run: |
          set -euo pipefail
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            build --release

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          status=$?
          set -o pipefail
          if [ "$status" -ne 0 ] && [ "$status" -ne 141 ]; then exit "$status"; fi

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests with diagnostics
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --info clean testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM device is not available on this GitHub runner"
            exit 1
          fi
          ls -l /dev/kvm

      - name: Run Rust JNI integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          disable-animations: true
          script: |
            bash scripts/run-android-jni-tests.sh

      - name: Verify APK
        if: success()
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/MoraShield-debug.apk
          HOOK_APK="location-hook/build/outputs/apk/debug/location-hook-debug.apk"
          test -s "$HOOK_APK"
          cp "$HOOK_APK" artifacts/Mora-Location-Hook-debug.apk
          sha256sum artifacts/*.apk | tee build-diagnostics.txt

      - name: Build failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Mora Shield build failed"
            echo
            echo "Download the mora-shield-diagnostics artifact for the full Gradle log."
            if [ -f build.log ]; then
              echo
              echo "### Last 120 lines"
              tail -n 120 build.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MoraShield-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics even when build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mora-shield-diagnostics
          path: |
            build.log
            instrumented-tests.log
            emulator-logcat.txt
            build-diagnostics.txt
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 30

  desktop-identity:
    name: Test Linux desktop identity helper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile helper
        run: python -m py_compile desktop-identity/mora_identity.py
      - name: Run unit tests
        run: python -m unittest discover -s desktop-identity/tests -v
      - name: Syntax check HyperOS ADB acceptance script
        run: bash -n scripts/mora-hyperos-acceptance.sh
